# Образец. Скопировать в docker-compose.override.yml (в git не попадает):
# compose подхватывает его сам, без -f.
#
# Здесь перечисляются подключённые проекты. У каждого свой compose.yml (образцы в examples/).
# Проект включён: строка есть. Заморожен: закомментирована. Удалён: строку убрать.

include:
  - ${SITES_PATH}/example/compose.yml
  # - ${SITES_PATH}/frozen-project/compose.yml

