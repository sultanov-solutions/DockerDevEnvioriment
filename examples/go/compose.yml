# Sample. Copy to the project root as compose.yml and replace "example" with the project name:
# names of services, volumes and routers must be unique across connected projects.
# To connect it: add a line to include in the environment's docker-compose.override.yml.
# Paths here are relative to the project folder; variables come from the environment's .env.
# Requires the image: the go profile in COMPOSE_PROFILES.

services:
  example-go:
    image: ${COMPOSE_PROJECT_NAME}-go
    pull_policy: never # local image built by the environment: do not look for it in a registry
    restart: unless-stopped
    working_dir: /app
    command: air # hot reload; settings in the project's .air.toml
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - ./:/app
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    networks: [local]
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.exampleGo.entrypoints=websecure"
      - "traefik.http.routers.exampleGo.tls=true"
      - "traefik.http.routers.exampleGo.rule=Host(`example.${DOMAIN}`)"
      - "traefik.http.services.exampleGo.loadbalancer.server.port=8000"
