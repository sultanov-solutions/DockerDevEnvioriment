# Sample. Copy to the project root as compose.yml and replace "example" with the project name:
# names of services, volumes and routers must be unique across connected projects.
# To connect it: add a line to include in the environment's docker-compose.override.yml.
# Paths here are relative to the project folder; variables come from the environment's .env.
# Requires the image: the php profile in COMPOSE_PROFILES.

services:
  example-php:
    image: ${COMPOSE_PROJECT_NAME}-php85
    pull_policy: never # local image built by the environment: do not look for it in a registry
    restart: unless-stopped
    # code on a shared folder (vboxsf): the nginx user needs its group
    group_add: ["${SHARED_GID}"]
    volumes:
      - ./:/var/www/html
      # Laravel/Symfony (web root in public/): put nginx.conf from the sample into the project
      # - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # queue workers, Octane: supervisor configs
      # - ./docker/supervisor:/etc/supervisor/custom.d:ro
    networks: [local]
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.examplePhp.entrypoints=websecure"
      - "traefik.http.routers.examplePhp.tls=true"
      - "traefik.http.routers.examplePhp.rule=Host(`example.${DOMAIN}`)"
      - "traefik.http.services.examplePhp.loadbalancer.server.port=8080"
