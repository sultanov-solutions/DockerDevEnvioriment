# Образец. Скопировать в корень проекта как compose.yml и заменить "example" на имя проекта:
# имена сервисов, томов и роутов должны быть уникальны среди подключённых проектов.
# Подключение: строка в include файла docker-compose.override.yml окружения.
# Пути здесь считаются от папки проекта; переменные берутся из .env окружения.
# Нужен образ: профиль java в COMPOSE_PROFILES.

services:
  example-java:
    image: ${COMPOSE_PROJECT_NAME}-java
    pull_policy: never # образ собирает окружение, в реестрах его нет
    restart: unless-stopped
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ./:/app
      - maven_m2:/root/.m2
    networks: [local]
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.exampleJava.entrypoints=websecure"
      - "traefik.http.routers.exampleJava.tls=true"
      - "traefik.http.routers.exampleJava.rule=Host(`example.${DOMAIN}`)"
      - "traefik.http.services.exampleJava.loadbalancer.server.port=8080"
