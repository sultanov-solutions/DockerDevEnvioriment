# Sample. Copy to the project root as compose.yml and replace "example" with the project name:
# names of services, volumes and routers must be unique across connected projects.
# To connect it: add a line to include in the environment's docker-compose.override.yml.
# Paths here are relative to the project folder; variables come from the environment's .env.
# Requires the image: the java profile in COMPOSE_PROFILES.

services:
  example-java:
    image: ${COMPOSE_PROJECT_NAME}-java
    pull_policy: never # local image built by the environment: do not look for it in a registry
    restart: unless-stopped
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ./:/app
      - maven_m2:/root/.m2
    networks: [local]
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.exampleJava.entrypoints=websecure"
      - "traefik.http.routers.exampleJava.tls=true"
      - "traefik.http.routers.exampleJava.rule=Host(`example.${DOMAIN}`)"
      - "traefik.http.services.exampleJava.loadbalancer.server.port=8080"
