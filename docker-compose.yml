x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-health-check
  interval: 30s
  timeout: 10s
  retries: 5

# Infrastructure and runtime images. COMPOSE_PROFILES in .env selects what to start and build;
# with no profile only traefik runs.
# Projects are connected by their own compose.yml through include in docker-compose.override.yml.

services:
  traefik:
    build: ${CONTAINERS_ROOT_PATH}/Traefik
    container_name: ${TRAEFIK_CONTAINER_NAME}
    hostname: ${TRAEFIK_CONTAINER_NAME}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      # traefik does not route containers in the "starting" state, itself included (dashboard)
      start_period: 10s
      start_interval: 1s
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TRAEFIK_STORAGE_PATH}/certs:/certs:ro
      - ${CONTAINERS_ROOT_PATH}/Traefik/dynamic:/dynamic:ro
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.network=${NETWORK_NAME}
      # only containers labelled devenv.traefik=<project> are routed: foreign stacks on this docker are invisible to us,
      # and a foreign traefik does not see us (the containers carry no traefik.enable=true label)
      - "--providers.docker.constraints=Label(`devenv.traefik`,`${COMPOSE_PROJECT_NAME:?set it in .env}`)"
      - --providers.file.directory=/dynamic/ # the trailing slash matters
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --ping=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
    networks:
      local:
        ipv4_address: ${SUBNET_PREFIX}.0.100
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"

  # One-off run: docker compose run --rm mkcert
  mkcert:
    profiles: ["init"]
    build: ${CONTAINERS_ROOT_PATH}/Mkcert
    environment:
      - CAROOT=/certs
    volumes:
      - ${TRAEFIK_STORAGE_PATH}/certs:/certs
      - ./mkcert-hosts.txt:/hosts.txt:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkcert -install -key-file /certs/local.key -cert-file /certs/local.crt \
          $$(sed 's/#.*//' /hosts.txt | tr -d '\r' | xargs) \
          && chown -R ${USER_ID}:${GROUP_ID} /certs

  portainer:
    profiles: ["tools"]
    build: ${CONTAINERS_ROOT_PATH}/Portainer
    container_name: ${PORTAINER_CONTAINER_NAME}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - local
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.pt.service=pt"
      - "traefik.http.routers.pt.entrypoints=websecure"
      - "traefik.http.routers.pt.tls=true"
      - "traefik.http.routers.pt.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.services.pt.loadbalancer.server.port=9000"

  redis:
    profiles: ["db"]
    container_name: ${REDIS_CONTAINER_NAME}
    hostname: ${REDIS_CONTAINER_NAME}
    build: ${CONTAINERS_ROOT_PATH}/Redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      <<: *default-health-check
      test: ["CMD", "redis-cli", "ping"]
      start_period: 30s
    networks:
      - local
    ports:
      - "${REDIS_PORT:-6379}:6379"

  redisinsight:
    profiles: ["db"]
    build: ${CONTAINERS_ROOT_PATH}/RedisInsight
    container_name: ${REDISINSIGHT_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    environment:
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
    networks:
      - local
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.redisinsight.service=redisinsight"
      - "traefik.http.routers.redisinsight.entrypoints=websecure"
      - "traefik.http.routers.redisinsight.tls=true"
      - "traefik.http.routers.redisinsight.rule=Host(`redis.${DOMAIN}`)"
      - "traefik.http.services.redisinsight.loadbalancer.server.port=5540"

  meilisearch:
    profiles: ["db"]
    build: ${CONTAINERS_ROOT_PATH}/MeiliSearch
    container_name: ${MEILISEARCH_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    logging: *default-logging
    networks:
      - local
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.meilisearch.service=meilisearch"
      - "traefik.http.routers.meilisearch.entrypoints=websecure"
      - "traefik.http.routers.meilisearch.tls=true"
      - "traefik.http.routers.meilisearch.rule=Host(`meilisearch.${DOMAIN}`)"
      - "traefik.http.services.meilisearch.loadbalancer.server.port=7700"

  postgres:
    profiles: ["db"]
    container_name: ${PGSQL_CONTAINER_NAME}
    hostname: ${PGSQL_CONTAINER_NAME}
    restart: unless-stopped
    build: ${CONTAINERS_ROOT_PATH}/PgSQL
    ports:
      - "${PGSQL_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ${PGSQL_STORAGE_PATH}/init:/docker-entrypoint-initdb.d
      - ${PGSQL_STORAGE_PATH}/tmp:/var/tmp-l # exchange dumps with the host
    environment:
      - POSTGRES_USER=${PGSQL_ROOT_USER}
      - POSTGRES_PASSWORD=${PGSQL_ROOT_PASSWORD}
    logging: *default-logging
    healthcheck:
      <<: *default-health-check
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_ROOT_USER}"]
      start_period: 30s
    networks:
      - local

  mysql:
    profiles: ["mysql"]
    container_name: ${MYSQL_CONTAINER_NAME}
    hostname: ${MYSQL_CONTAINER_NAME}
    restart: unless-stopped
    build: ${CONTAINERS_ROOT_PATH}/MySQL
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    logging: *default-logging
    healthcheck:
      <<: *default-health-check
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      start_period: 60s
    networks:
      - local

  mongo:
    profiles: ["mongo"]
    container_name: ${MONGO_CONTAINER_NAME}
    hostname: ${MONGO_CONTAINER_NAME}
    restart: unless-stopped
    build: ${CONTAINERS_ROOT_PATH}/MongoDB
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    logging: *default-logging
    healthcheck:
      <<: *default-health-check
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      start_period: 30s
    networks:
      - local

  rabbitmq:
    profiles: ["rabbitmq"]
    container_name: ${RABBITMQ_CONTAINER_NAME}
    # rabbitmq stores its data under the node name, which is derived from the hostname: keep it stable
    hostname: ${RABBITMQ_CONTAINER_NAME}
    restart: unless-stopped
    build: ${CONTAINERS_ROOT_PATH}/RabbitMQ
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    logging: *default-logging
    healthcheck:
      <<: *default-health-check
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 60s
    networks:
      - local
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.rabbitmq.service=rabbitmq"
      - "traefik.http.routers.rabbitmq.entrypoints=websecure"
      - "traefik.http.routers.rabbitmq.tls=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.${DOMAIN}`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  # Catches all outgoing mail: projects send to SMTP mailpit:1025, the inbox is at mail.<DOMAIN>
  mailpit:
    profiles: ["mail"]
    container_name: ${MAILPIT_CONTAINER_NAME}
    hostname: ${MAILPIT_CONTAINER_NAME}
    restart: unless-stopped
    build: ${CONTAINERS_ROOT_PATH}/Mailpit
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      # accept any SMTP login and no TLS: frameworks can keep their usual mail settings
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    logging: *default-logging
    networks:
      - local
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.mailpit.service=mailpit"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.${DOMAIN}`)"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  # --- Runtime images ----------------------------------------------------------------
  # scale: 0 = the service only builds an image and starts no containers.
  # Projects describe the containers in their own compose.yml: image: ${COMPOSE_PROJECT_NAME}-<name>
  # (samples in examples/). The profiles in COMPOSE_PROFILES decide which images are built.

  php85:
    profiles: ["php"]
    image: ${COMPOSE_PROJECT_NAME}-php85
    build:
      context: ${CONTAINERS_ROOT_PATH}/PHP/8.5
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    scale: 0
    pull_policy: build # local image: always build, never look for it in a registry

  node:
    profiles: ["node"]
    image: ${COMPOSE_PROJECT_NAME}-node
    build: ${CONTAINERS_ROOT_PATH}/NodeJS
    scale: 0
    pull_policy: build # local image: always build, never look for it in a registry

  go:
    profiles: ["go"]
    image: ${COMPOSE_PROJECT_NAME}-go
    build: ${CONTAINERS_ROOT_PATH}/Golang
    scale: 0
    pull_policy: build # local image: always build, never look for it in a registry

  python:
    profiles: ["python"]
    image: ${COMPOSE_PROJECT_NAME}-python
    build: ${CONTAINERS_ROOT_PATH}/Python
    scale: 0
    pull_policy: build # local image: always build, never look for it in a registry

  rust:
    profiles: ["rust"]
    image: ${COMPOSE_PROJECT_NAME}-rust
    build: ${CONTAINERS_ROOT_PATH}/Rust
    scale: 0
    pull_policy: build # local image: always build, never look for it in a registry

  java:
    profiles: ["java"]
    image: ${COMPOSE_PROJECT_NAME}-java
    build: ${CONTAINERS_ROOT_PATH}/Java
    scale: 0
    pull_policy: build # local image: always build, never look for it in a registry

  forgejo:
    profiles: ["git"]
    build: ${CONTAINERS_ROOT_PATH}/Forgejo
    container_name: ${FORGEJO_CONTAINER_NAME}
    hostname: ${FORGEJO_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: git.${DOMAIN}
      FORGEJO__server__ROOT_URL: https://git.${DOMAIN}/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__webhook__ALLOWED_HOST_LIST: private
      FORGEJO__log__LEVEL: Warn
    volumes:
      - forgejo_data:/var/lib/gitea
      - forgejo_config:/etc/gitea
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.forgejo.service=forgejo"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls=true"
      - "traefik.http.routers.forgejo.rule=Host(`git.${DOMAIN}`)"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
    networks:
      - local
    logging: *default-logging

  # Needs FORGEJOMCP_TOKEN (a token from Forgejo), hence a separate profile.
  forgejo-mcp:
    profiles: ["git-mcp"]
    build: ${CONTAINERS_ROOT_PATH}/ForgejoMcp
    container_name: ${FORGEJO_MCP_CONTAINER_NAME}
    hostname: ${FORGEJO_MCP_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - forgejo
    command: http --address :8080 --server http://${FORGEJO_CONTAINER_NAME}:3000
    environment:
      FORGEJOMCP_TOKEN: ${FORGEJOMCP_TOKEN}
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.forgejoMcp.service=forgejoMcp"
      - "traefik.http.routers.forgejoMcp.entrypoints=websecure"
      - "traefik.http.routers.forgejoMcp.tls=true"
      - "traefik.http.routers.forgejoMcp.rule=Host(`git.${DOMAIN}`) && PathPrefix(`/_mcp/${GIT_MCP_PATH_KEY}`)"
      - "traefik.http.routers.forgejoMcp.priority=100"
      - "traefik.http.routers.forgejoMcp.middlewares=forgejoMcpStrip"
      - "traefik.http.middlewares.forgejoMcpStrip.stripprefix.prefixes=/_mcp/${GIT_MCP_PATH_KEY}"
      - "traefik.http.services.forgejoMcp.loadbalancer.server.port=8080"
    networks:
      - local
    logging: *default-logging

  garage:
    profiles: ["s3"]
    build: ${CONTAINERS_ROOT_PATH}/Garage
    container_name: ${GARAGE_CONTAINER_NAME}
    hostname: ${GARAGE_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      # secrets come from .env, not from garage.toml: the config stays in the repository
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ${CONTAINERS_ROOT_PATH}/Garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.garageS3.service=garageS3"
      - "traefik.http.routers.garageS3.entrypoints=websecure"
      - "traefik.http.routers.garageS3.tls=true"
      - "traefik.http.routers.garageS3.rule=Host(`s3.${DOMAIN}`)"
      - "traefik.http.services.garageS3.loadbalancer.server.port=3900"
    networks:
      - local
    logging: *default-logging

  garage-webui:
    profiles: ["s3"]
    build: ${CONTAINERS_ROOT_PATH}/GarageWebUI
    container_name: ${GARAGE_CONTAINER_NAME}_WEBUI
    hostname: ${GARAGE_CONTAINER_NAME}_WEBUI
    restart: unless-stopped
    depends_on:
      - garage
    environment:
      API_BASE_URL: http://${GARAGE_CONTAINER_NAME}:3903
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN}
      S3_ENDPOINT_URL: http://${GARAGE_CONTAINER_NAME}:3900
      S3_REGION: garage
    labels:
      - "devenv.traefik=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.garageUi.service=garageUi"
      - "traefik.http.routers.garageUi.entrypoints=websecure"
      - "traefik.http.routers.garageUi.tls=true"
      - "traefik.http.routers.garageUi.rule=Host(`garage.${DOMAIN}`)"
      - "traefik.http.services.garageUi.loadbalancer.server.port=3909"
    networks:
      - local
    logging: *default-logging

networks:
  local:
    name: ${NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_PREFIX}.0.0/16

# Infrastructure data and shared build caches (mounted by projects): named volumes,
# the same on every OS and with no permission juggling.
# What people handle by hand stays visible in storage/: certificates and database dumps.
volumes:
  portainer_data:
  redis_data:
  redisinsight_data:
  meili_data:
  pgsql_data:
  mysql_data:
  mongo_data:
  mongo_config:
  rabbitmq_data:
  mailpit_data:
  go_mod:
  go_build:
  maven_m2:
  pip_cache:
  cargo_registry:
  pnpm_store:
  forgejo_data:
  forgejo_config:
  garage_meta:
  garage_data:
